dependencies:
  idf:
    version: ">=5.5,<6.0"

  espressif/esp_wifi_remote:
    version: "0.16.3"

  espressif/esp_hosted:
    version: "3.0.9"

  # Bare TinyUSB library. The ESP-IDF wrapper (esp_tinyusb) is vendored locally under
  # components/esp_tinyusb so we can set the disk name durably; it depends on this raw
  # lib. Note: use espressif/tinyusb, not espressif/esp_tinyusb (the bare lib has no
  # Kconfig and expects the app to supply tusb_config.h).
  espressif/tinyusb:
    version: ">=0.17.0~2"
